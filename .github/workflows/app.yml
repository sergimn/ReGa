name: App

on:
  push:
    branches: [main]
    # The app compiles the Terraform module in.
    paths: ['app/**', 'infra/terraform/aws/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'infra/terraform/aws/**', '.github/workflows/app.yml']

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

env:
  FLUTTER_VERSION: 3.47.7
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  flutter:
    name: Flutter (analyze, test, Linux build)
    runs-on: ubuntu-24.04
    # The AWS SDK crates make a cold Rust build slow; it's built twice here
    # (release, then debug for the integration test).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
      # cargokit builds the Rust core inside Flutter's build folder.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app -> build/linux/x64/release/plugins/rega_bridge/cargokit_build
            app -> build/linux/x64/debug/plugins/rega_bridge/cargokit_build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: End-to-end test against the Rust core
        run: xvfb-run -a flutter test integration_test -d linux
      # Artifacts drop file permissions, so ship the bundle as a tarball.
      - run: tar -C build/linux/x64/release -czf rega-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v7
        with:
          name: rega-linux-x64
          path: app/rega-linux-x64.tar.gz

  flatpak:
    name: Flatpak
    needs: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: rega-linux-x64
          path: app
      - run: mkdir -p build/linux/x64/release && tar -C build/linux/x64/release -xzf rega-linux-x64.tar.gz
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: rega.flatpak
          manifest-path: app/flatpak/io.github.sergimn.rega.yml
          cache: false
