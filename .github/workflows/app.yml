name: App

on:
  push:
    branches: [main]
    # The app compiles the Terraform module in.
    paths: ['app/**', 'infra/terraform/aws/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'infra/terraform/aws/**', '.github/workflows/app.yml']

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

env:
  # renovate: datasource=flutter-version depName=flutter
  FLUTTER_VERSION: 3.47.7
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  flutter:
    name: Flutter (analyze, test, Linux build)
    runs-on: ubuntu-24.04
    # The AWS SDK crates make a cold Rust build slow; it's built twice here
    # (release, then debug for the integration test).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      # cargokit builds the Rust core inside Flutter's build folder.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            app -> build/linux/x64/release/plugins/rega_bridge/cargokit_build
            app -> build/linux/x64/debug/plugins/rega_bridge/cargokit_build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: End-to-end test against the Rust core
        run: xvfb-run -a flutter test integration_test -d linux
        # Demo data, without even trying the AWS credential chain.
        env:
          REGA_DEMO: '1'
      # Artifacts drop file permissions, so ship the bundle as a tarball.
      - run: tar -C build/linux/x64/release -czf rega-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rega-linux-x64
          path: app/rega-linux-x64.tar.gz

  flatpak:
    name: Flatpak
    needs: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rega-linux-x64
          path: app
      - run: mkdir -p build/linux/x64/release && tar -C build/linux/x64/release -xzf rega-linux-x64.tar.gz
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: rega.flatpak
          manifest-path: app/flatpak/io.github.sergimn.rega.yml
          cache: false
