name: App

on:
  push:
    branches: [main]
    # The app compiles the Terraform module and the Ansible playbook in, and
    # the Flatpak bundles Terraform at the version terraform.yml tests with.
    # docs/releases holds the notes the version check asks for.
    paths: ['app/**', 'infra/terraform/aws/**', 'infra/ansible/**', 'docs/releases/**', '.github/workflows/terraform.yml', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'infra/terraform/aws/**', 'infra/ansible/**', 'docs/releases/**', '.github/workflows/terraform.yml', '.github/workflows/app.yml']
  # The Release workflow runs all of this on the tag and publishes the
  # Flatpak the run builds.
  workflow_call:
    inputs:
      release:
        description: Run as for a release, from a cold start (no caches).
        type: boolean
        default: false
  # To try a release build, uncached, without tagging anything.
  workflow_dispatch:
    inputs:
      release:
        description: Run as for a release, from a cold start (no caches).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A release build run by hand gets its own group, so it and a push to the
  # same branch don't cancel each other while queued.
  group: app-${{ github.ref }}${{ inputs.release && '-release' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

env:
  # renovate: datasource=flutter-version depName=flutter
  FLUTTER_VERSION: 3.47.7
  # renovate: datasource=rust-version depName=rust
  RUST_VERSION: 1.98.1
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup comes with the runner image.
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$RUST_VERSION"
      # No caches on a release, like the Flutter job below.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.release }}
        with:
          workspaces: app
      # The setup tests syntax-check the embedded playbooks with the real
      # ansible-playbook.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"
      - name: Install Ansible
        working-directory: infra/ansible
        run: |
          pip install -r requirements.lock
          ansible-galaxy collection install -r requirements.yml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Flatpak build writes them; this says sooner when one can't be.
      - name: Every crate has a licence text to ship
        run: python3 flatpak/rust_notices.py check
      # For tests/tunnel.rs: a WireGuard server set up like a ReGa machine,
      # in a network namespace, with the kernel's WireGuard. GNOME Keyring is
      # for the credentials store's test.
      - name: Start a WireGuard test server
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools gnome-keyring
          # The runner's user writes the file, not root.
          # shellcheck disable=SC2024
          sudo core/tests/wireguard/server.sh up > "$RUNNER_TEMP/wg-test.env"
      # In a D-Bus session with a throwaway GNOME Keyring as its Secret
      # Service, so the credentials store is tested against a real one.
      - name: cargo test
        run: |
          set -a
          . "$RUNNER_TEMP/wg-test.env"
          set +a
          dbus-run-session -- core/tests/with-keyring.sh cargo test --workspace --locked
        env:
          REGA_REQUIRE_ANSIBLE: '1'
          REGA_REQUIRE_WG_SERVER: '1'

  flutter:
    name: Flutter (analyze, test, Linux build)
    runs-on: ubuntu-26.04
    # The AWS SDK crates make a cold Rust build slow; it's built twice here
    # (release, then debug for the integration test).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      # cargokit (app/rust_builder) always builds with `rustup run stable`,
      # so stable is pointed at the pinned toolchain for the app build.
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustup toolchain uninstall stable
          sysroot=$(rustc --print sysroot)
          ln -s "$sysroot" "$(dirname "$sysroot")/stable-$(rustc -vV | sed -n 's/^host: //p')"
          rustup run stable rustc --version | grep -F "rustc $RUST_VERSION "
      # cargokit builds the Rust core inside Flutter's build folder. A
      # release runs without caches, as the Flatpak job always does.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.release }}
        with:
          workspaces: |
            app -> build/linux/x64/release/plugins/rega_bridge/cargokit_build
            app -> build/linux/x64/debug/plugins/rega_bridge/cargokit_build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: ${{ !inputs.release }}
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: End-to-end test against the Rust core
        run: xvfb-run -a flutter test integration_test -d linux
        # Demo data, leaving the keyring alone.
        env:
          REGA_DEMO: '1'

  flatpak:
    name: Flatpak
    runs-on: ubuntu-26.04
    # Builds the app from source, as Flathub would: the Flutter SDK, the Rust
    # toolchain and every crate and Dart package, with no network.
    timeout-minutes: 60
    container:
      # Built 2026-09-22, under the 30 days the rest of the repo waits: the
      # registry only lists this tag's current digest, so no older one could
      # be found to pin. Renovate can't date these images either, so updates
      # wait on the Dependency Dashboard (see CONTRIBUTING.md).
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sources of the crates and Dart packages in the locks
        run: python3 flatpak/sources.py write
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: rega.flatpak
          manifest-path: app/flatpak/io.github.sergimn.rega.yml
          artifact-name: rega-flatpak
          cache: false
      # The checks Flathub runs on a submission, from the image's linter, less
      # the one that only Flathub's own build can pass (lint-exceptions.json).
      - name: Flathub's linter
        run: |
          flatpak-builder-lint --gha-format manifest flatpak/io.github.sergimn.rega.yml
          flatpak-builder-lint --gha-format --exceptions --user-exceptions flatpak/lint-exceptions.json \
            builddir ../flatpak_app

  flatpak-metadata:
    name: Flatpak pins and metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bundled tools match the repo's pins
        run: python3 flatpak/pins.py check
      - name: The Flatpak builds with CI's Flutter and Rust, from offline sources
        run: python3 flatpak/sources.py check
      - name: The version agrees everywhere and has release notes
        run: python3 flatpak/release.py check
      - name: Pin, source and release check tests
        run: python3 -m unittest discover -s flatpak -v
      - name: Validate the desktop file and metainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          desktop-file-validate flatpak/io.github.sergimn.rega.desktop
          appstreamcli validate --no-net flatpak/io.github.sergimn.rega.metainfo.xml

  flatpak-install:
    name: Flatpak installed on Ubuntu
    # Installs the bundle the way a user would, runtime from Flathub, and
    # checks the bundled tools and the app inside the sandbox.
    needs: flatpak
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rega-flatpak
          path: app
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb xdotool
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: flatpak install --user -y --noninteractive rega.flatpak
      - run: dbus-run-session -- flatpak/smoke-test.sh
