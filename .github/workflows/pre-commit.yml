name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install pre-commit
        run: pip install -r .github/requirements/pre-commit.lock

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # The hook environments are tied to this Python.
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The App, Terraform and Ansible workflows run these with the right
      # toolchains. pip installs each hook's own dependencies, which the
      # config doesn't pin; it only takes releases at least 30 days old, like
      # Renovate.
      - name: Run the hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: cargo-fmt,dart-format,terraform-fmt,ansible-lint,zizmor
          PIP_UPLOADED_PRIOR_TO: P30D

      # Again with a token, so zizmor can also check that every pinned commit
      # belongs to the action it names and has no known vulnerability.
      - name: Run zizmor with GitHub access
        run: pre-commit run zizmor --all-files
        env:
          GH_TOKEN: ${{ github.token }}
          PIP_UPLOADED_PRIOR_TO: P30D
