name: Ansible

# The Windows job also checks the app's WireGuard tunnel and Sunshine client
# against the machine the playbook sets up, so their code triggers it too.
on:
  pull_request:
    paths:
      - "infra/ansible/**"
      - "infra/terraform/aws/templates/**"
      - "app/core/src/stream/**"
      - "app/core/src/ansible.rs"
      - "app/core/examples/**"
      # Crate updates too: rustls and reqwest meet the real Sunshine here.
      - "app/core/Cargo.toml"
      - "app/Cargo.lock"
      - ".github/workflows/ansible.yml"
  push:
    branches: [main]
    paths:
      - "infra/ansible/**"
      - "infra/terraform/aws/templates/**"
      - "app/core/src/stream/**"
      - "app/core/src/ansible.rs"
      - "app/core/examples/**"
      # Crate updates too: rustls and reqwest meet the real Sunshine here.
      - "app/core/Cargo.toml"
      - "app/Cargo.lock"
      - ".github/workflows/ansible.yml"

permissions:
  contents: read

env:
  # renovate: datasource=nuget depName=Pester registryUrl=https://www.powershellgallery.com/api/v2/
  PESTER_VERSION: 5.9.1
  # renovate: datasource=nuget depName=PSScriptAnalyzer registryUrl=https://www.powershellgallery.com/api/v2/
  PSSCRIPTANALYZER_VERSION: 1.25.0
  # renovate: datasource=rust-version depName=rust
  RUST_VERSION: 1.98.1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install Ansible
        run: |
          pip install -r requirements-lint.lock
          ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: |
          ansible-playbook -i inventory.example.yml site.yml --syntax-check
          ansible-playbook -i inventory.example.yml agent.yml --syntax-check

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Get-ChildItem roles -Recurse -Include *.ps1, *.psm1 |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings tests/PSScriptAnalyzerSettings.psd1 }
          $results | Format-Table -AutoSize ScriptName, Line, RuleName, Message | Out-String -Width 300
          if ($results) { exit 1 }

      - name: Pester (PowerShell 7)
        shell: pwsh
        run: |
          $result = Invoke-Pester tests/pester -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  stream-check:
    name: Build the stream check
    # app/core/examples/rega-stream-check.rs, which the Windows job runs to
    # reach Sunshine through the app's own WireGuard tunnel.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rustup comes with the runner image.
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app
      - run: cargo build --locked -p rega_core --example rega-stream-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rega-stream-check
          path: app/target/debug/examples/rega-stream-check
          if-no-files-found: error

  windows:
    name: Playbook on Windows Server 2022
    # Runs the real playbook against the runner itself, from Ansible inside
    # WSL, over WinRM HTTPS set up by Terraform's boot script. No AWS: the
    # NVIDIA driver and the S3 sync can't be exercised here.
    needs: stream-check
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rega-stream-check
          path: stream-check

      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $result = Invoke-Pester infra/ansible/tests/pester -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Enable WinRM HTTPS with Terraform's boot script
        shell: powershell
        run: |
          # EC2 Windows AMIs ship with WinRM running; the runner may not.
          Enable-PSRemoting -SkipNetworkProfileCheck -Force | Out-Null
          $template = Get-Content infra/terraform/aws/templates/user_data.ps1.tftpl -Raw
          $script = [regex]::Match($template, '(?s)<powershell>(.*)</powershell>').Groups[1].Value
          Set-Content -Path "$env:RUNNER_TEMP\user_data.ps1" -Value $script
          & "$env:RUNNER_TEMP\user_data.ps1"
          Get-ChildItem WSMan:\localhost\Listener | Format-List Keys

      - name: Create the admin account Ansible logs in with
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Web
          $password = [Web.Security.Membership]::GeneratePassword(24, 4) + 'aA1'
          Set-Content -Path "$env:GITHUB_WORKSPACE\ci-password" -Value $password -NoNewline
          New-LocalUser -Name regaci -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Administrators -Member regaci
          # EC2 uses the built-in Administrator; other local admins need this
          # to get an elevated token over WinRM.
          New-ItemProperty -Path HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System -Name LocalAccountTokenFilterPolicy -Value 1 -PropertyType DWord -Force | Out-Null

      # Hosted runners have no nested virtualisation, so WSL 1, which shares
      # the host's network: 127.0.0.1:5986 is the runner's WinRM listener.
      - uses: Vampire/setup-wsl@79d85ead05e70e4ba1e1e83367db6e0ccb89b578 # v4.1.1
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          additional-packages: python3-venv python3-pip

      - name: Install Ansible in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cp -r infra/ansible ~/ansible
          python3 -m venv ~/venv
          ~/venv/bin/pip install --quiet -r ~/ansible/requirements.lock
          ~/venv/bin/ansible-galaxy collection install -r ~/ansible/requirements.yml
          # The app's WireGuard key, as the app passes it to the playbook.
          # Artifacts drop the executable bit.
          install -m 755 stream-check/rega-stream-check ~/rega-stream-check
          ~/rega-stream-check keygen ~/wireguard-client.key > ~/wireguard-client.pub
          cat > ~/ansible/inventory.yml <<INVENTORY
          rega:
            hosts:
              ci:
                ansible_host: 127.0.0.1
                ansible_user: regaci
                # !unsafe: the random password can hold "{%" or "{{", which
                # Ansible would otherwise read as a template.
                ansible_password: !unsafe "$(cat ci-password)"
          INVENTORY

      - name: Run the playbook
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd ~/ansible
          ~/venv/bin/ansible-playbook -i inventory.yml site.yml \
            -e rega_reboot_allowed=false -e rega_idle_stop_enabled=false -e rega_restore_wait_minutes=1 \
            -e rega_setup_hold_minutes=1440 \
            -e rega_wireguard_client_public_key="$(cat ~/wireguard-client.pub)"

      - name: Run it again; nothing should change
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          workspace=$PWD
          cd ~/ansible
          ~/venv/bin/ansible-playbook -i inventory.yml site.yml \
            -e rega_reboot_allowed=false -e rega_idle_stop_enabled=false -e rega_restore_wait_minutes=1 \
            -e rega_setup_hold_minutes=1440 \
            -e rega_wireguard_client_public_key="$(cat ~/wireguard-client.pub)" \
            --diff | tee second-run.log
          grep -Eq 'ci +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0 ' second-run.log
          # The setup wrote its note for the library restore and deleted it.
          for task in 'Note on the machine that a setup has started' 'Let the library restore go ahead'; do
            grep -A1 -F "TASK [$task]" second-run.log | grep -F 'ok: [ci]' > /dev/null ||
              { echo "::error::'$task' wasn't ok on the second run"; exit 1; }
          done
          # For the checks below, which run on the Windows side.
          cp ~/.local/share/rega/machines/ci/sunshine-password "$workspace/sunshine-password"

      # WSL 1 shares the runner's network, so the machine's WireGuard port
      # is 127.0.0.1:51820.
      - name: Reach Sunshine through the app's WireGuard tunnel
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          secrets=~/.local/share/rega/machines/ci
          # With the app's key, the playbook makes no client config.
          test ! -e "$secrets/wireguard-client.conf"
          ~/rega-stream-check check "$secrets" ~/wireguard-client.key 127.0.0.1:51820

      - name: Run the agent actions the app uses
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd ~/ansible
          ~/venv/bin/ansible-playbook -i inventory.yml agent.yml -e rega_agent_action=Status
          # The setup started a restore, which finds no library disk on the
          # runner, so waiting for it fails and says why.
          if ~/venv/bin/ansible-playbook -i inventory.yml agent.yml -e rega_agent_action=WaitRestore \
            > wait-restore.log; then
            cat wait-restore.log
            echo "WaitRestore should fail without a library disk"
            exit 1
          fi
          cat wait-restore.log
          grep -q 'no game library disk' wait-restore.log

      # The runner can't reboot, so act as if a setup that started before
      # this boot had rebooted it: the boot task's restore must wait for that
      # setup to end, so the setup's next reboot can't cut it short.
      - name: Hold the restore while a setup reboots the machine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert($condition, $message) { if (-not $condition) { throw $message } ; "ok: $message" }
          $state = 'C:\ProgramData\ReGa\state'
          # The agent replaces restore.json as it goes; a read can miss it.
          function Get-RestoreStatus {
            try { (Get-Content "$state\restore.json" -Raw | ConvertFrom-Json).status } catch { $null }
          }
          function Wait-RestoreStatus($statuses, $seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-RestoreStatus) -notin $statuses -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
            Get-RestoreStatus
          }

          Assert (-not (Test-Path "$state\setup.json")) 'the setup let the restore go ahead when it ended'

          # The playbook ran with rega_setup_hold_minutes=1440, so the hold
          # doesn't run out however long the runner has been up.
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime()
          $note = @{ started_utc = $boot.AddMinutes(-1).ToString('o') } | ConvertTo-Json
          [IO.File]::WriteAllText("$state\setup.json", $note)
          Start-ScheduledTask -TaskName ReGa-LibraryRestore
          $status = Wait-RestoreStatus @('waiting') 60
          Assert ($status -eq 'waiting') "the boot task's restore waits for the setup ($status)"
          Start-Sleep -Seconds 20
          Assert ((Get-RestoreStatus) -eq 'waiting') 'it keeps waiting while the setup runs'
          $agent = 'C:\ProgramData\ReGa\agent\rega-agent.ps1'
          # Windows PowerShell stops on a native command's stderr under 'Stop'.
          $ErrorActionPreference = 'Continue'
          $wait = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $agent -Action WaitRestore -StartMinutes 0 -TimeoutMinutes 0 2>&1 |
            ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $result = $wait | Where-Object { $_ -like '{*' } | Select-Object -First 1 | ConvertFrom-Json
          Assert ($code -eq 1 -and $result.wait -eq 'running') "WaitRestore keeps waiting for a held restore ($($wait -join ' '))"
          Assert (($wait -join ' ') -match 'waiting for the machine.s setup') 'WaitRestore says what the restore waits for'
          $start = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $agent -Action StartRestore | ConvertFrom-Json
          Assert (-not $start.started) "StartRestore doesn't start a second restore"

          # The waiting restore reads the note every 10 seconds; Windows won't
          # delete it mid-read.
          for ($i = 0; (Test-Path "$state\setup.json"); $i++) {
            try { Remove-Item "$state\setup.json" } catch { if ($i -ge 5) { throw } ; Start-Sleep -Seconds 1 }
          }
          # With no library disk on the runner, the restore gives up after
          # rega_restore_wait_minutes (1).
          $status = Wait-RestoreStatus @('no-disk', 'done', 'failed', 'disk-full') 180
          Assert ($status -eq 'no-disk') "the restore goes ahead once the setup ends ($status)"
          Get-Content C:\ProgramData\ReGa\logs\agent.log | Select-Object -Last 5

      - name: Check the machine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert($condition, $message) { if (-not $condition) { throw $message } ; "ok: $message" }

          foreach ($name in @('SunshineService', 'WireGuardTunnel$rega', 'Audiosrv')) {
            Assert ((Get-Service $name).Status -eq 'Running') "$name is running"
          }
          foreach ($task in @('ReGa-Agent', 'ReGa-LibraryRestore', 'ReGa-SteamLaunch', 'ReGa-GpuSetup', 'ReGa-LibraryDisk')) {
            Assert ([bool](Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue)) "task $task exists"
          }
          Assert (Test-Path 'C:\Program Files (x86)\Steam\steam.exe') 'Steam is installed'
          Assert (Test-Path 'C:\Program Files\Amazon\AWSCLIV2\aws.exe') 'the AWS CLI is installed'

          $wg = & 'C:\Program Files\WireGuard\wg.exe' show rega allowed-ips
          Assert ($wg -match '10\.213\.37\.2/32') "the tunnel has the client peer ($wg)"

          $acl = (Get-Acl 'C:\ProgramData\ReGa\wireguard').Access | ForEach-Object { $_.IdentityReference.Value }
          Assert (-not ($acl -match 'Users')) "only SYSTEM and administrators can read the WireGuard keys ($($acl -join ', '))"

          $password = Get-Content sunshine-password -Raw
          $code = & curl.exe -sk -o NUL -w '%{http_code}' -u "rega:$($password.Trim())" https://localhost:47990/api/config
          Assert ($code -eq '200') "the Sunshine API accepts the generated login (HTTP $code)"
          $code = & curl.exe -sk -o NUL -w '%{http_code}' -u 'rega:wrong' https://localhost:47990/api/config
          Assert ($code -eq '401') "the Sunshine API rejects a wrong password (HTTP $code)"

          $status = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\ReGa\agent\rega-agent.ps1 -Action Status | ConvertFrom-Json
          Assert ($status.streaming -eq $false) 'the agent sees no Moonlight stream'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\ReGa\agent\rega-agent.ps1 -Action Tick
          Assert ($LASTEXITCODE -eq 0) 'an agent tick off EC2 exits cleanly'
          Get-Content C:\ProgramData\ReGa\logs\agent.log -ErrorAction SilentlyContinue | Select-Object -Last 20

      - name: Install the virtual display
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\ReGa\agent\rega-gpu-setup.ps1 -Action VirtualDisplay -NoReboot
          if ($LASTEXITCODE -ne 0) { throw "GPU setup failed: $out" }
          $out
          $vdd = Get-PnpDevice -PresentOnly | Where-Object { $_.HardwareID -contains 'Root\MttVDD' }
          $vdd | Format-Table -AutoSize Status, Class, FriendlyName, InstanceId | Out-String -Width 200
          if (-not $vdd -or $vdd.Status -ne 'OK') { throw 'The virtual display is not working.' }
          Get-Content C:\ProgramData\ReGa\logs\gpu-setup.log

      - name: Logs
        if: always()
        shell: powershell
        run: |
          Get-ChildItem C:\ProgramData\ReGa\logs -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 50 }
          Get-Content 'C:\Program Files\Sunshine\config\sunshine.log' -Tail 40 -ErrorAction SilentlyContinue
