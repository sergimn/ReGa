# Packages the Flutter release bundle built by `flutter build linux --release`.
# Build from app/: see flatpak/README.md.
id: io.github.sergimn.rega
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rega
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # AWS credentials and profiles, read by the app and by Terraform. The SSO
  # token cache is writable so an SSO sign-in can refresh its token.
  - --filesystem=~/.aws:ro
  - --filesystem=~/.aws/sso/cache:create
modules:
  # The app runs Terraform to create, change and destroy machines. Keep the
  # version in step with .github/workflows/terraform.yml.
  - name: terraform
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 terraform /app/bin/terraform
      # Its licence (BUSL-1.1) asks for a copy next to every copy of it.
      - install -Dm644 LICENSE.txt /app/share/licenses/io.github.sergimn.rega/terraform/LICENSE.txt
    sources:
      - type: archive
        url: https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
        sha256: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
        # The zip has the binary at its root, with no folder to strip.
        strip-components: 0
  # Ansible configures a machine after Terraform makes it. Generated from
  # infra/ansible's pins by pins.py; CI fails when they drift apart.
  - ansible.yml
  - name: rega
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/rega /app/bin
      - cp -r bundle/. /app/lib/rega/
      - ln -s /app/lib/rega/rega /app/bin/rega
      - install -Dm644 io.github.sergimn.rega.desktop -t /app/share/applications
      - install -Dm644 io.github.sergimn.rega.metainfo.xml -t /app/share/metainfo
      - install -Dm644 rega.svg /app/share/icons/hicolor/scalable/apps/io.github.sergimn.rega.svg
      - for s in 64 128 256 512; do install -Dm644 rega-$s.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.sergimn.rega.png; done
    sources:
      - type: dir
        path: ../build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: io.github.sergimn.rega.desktop
      - type: file
        path: io.github.sergimn.rega.metainfo.xml
      - type: file
        path: ../assets/icon/rega.svg
      - type: file
        path: ../assets/icon/rega-64.png
      - type: file
        path: ../assets/icon/rega-128.png
      - type: file
        path: ../assets/icon/rega-256.png
      - type: file
        path: ../assets/icon/rega-512.png
