# Packages the Flutter release bundle built by `flutter build linux --release`.
# Build from app/: see flatpak/README.md.
id: io.github.sergimn.rega
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rega
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: rega
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/rega /app/bin
      - cp -r bundle/. /app/lib/rega/
      - ln -s /app/lib/rega/rega /app/bin/rega
      - install -Dm644 io.github.sergimn.rega.desktop -t /app/share/applications
      - install -Dm644 io.github.sergimn.rega.metainfo.xml -t /app/share/metainfo
      - install -Dm644 io.github.sergimn.rega.svg -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: dir
        path: ../build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: io.github.sergimn.rega.desktop
      - type: file
        path: io.github.sergimn.rega.metainfo.xml
      - type: file
        path: io.github.sergimn.rega.svg
