# Builds the app from source, with no network, from sources pinned by hash:
# the Flutter SDK and Rust toolchain CI uses (flutter.yml and rust.yml), and
# the Dart packages and crates in the app's locks (generated/, which
# `sources.py write` makes). Build from app/: see flatpak/README.md.
id: io.github.sergimn.rega
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# Flutter builds the app's runner with clang.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
command: rega
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # No access to ~/.aws or any other cloud CLI's files: ReGa only uses the
  # credentials entered in the app. It keeps them in the system keyring
  # through the Secret portal, which needs no permission here.
modules:
  # The app runs Terraform to create, change and destroy machines. Keep the
  # version in step with .github/workflows/terraform.yml.
  - name: terraform
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 terraform /app/bin/terraform
      # Its licence (BUSL-1.1) asks for a copy next to every copy of it.
      - install -Dm644 LICENSE.txt /app/share/licenses/io.github.sergimn.rega/terraform/LICENSE.txt
    sources:
      - type: archive
        url: https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
        sha256: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
        # The zip has the binary at its root, with no folder to strip.
        strip-components: 0
  # Ansible configures a machine after Terraform makes it. Generated from
  # infra/ansible's pins by pins.py; CI fails when they drift apart.
  - ansible.yml
  # The SDK and toolchain that build the app, at the versions CI uses. They
  # go to /var/lib, which the Flatpak doesn't ship.
  - flutter.yml
  - rust.yml
  - name: rega
    buildsystem: simple
    build-options:
      # No CFLAGS, as in CI: aws-lc, in the Rust core, has to build its jitter
      # entropy source with -O0, and the cc crate puts the SDK's -O2 after it.
      cflags: ''
      cflags-override: true
      append-path: /usr/lib/sdk/llvm21/bin:/var/lib/flutter/bin:/var/lib/rust/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
      env:
        PUB_CACHE: /run/build/rega/pub-cache
        CARGO_HOME: /run/build/rega/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cd app && flutter pub get --offline --enforce-lockfile
      - cd app && flutter build linux --release --no-pub
      # The Rust crates' and standard library's licences ask for their
      # notices to go with every copy.
      - cd app && python3 flatpak/rust_notices.py write build/linux/x64/release/licenses
      - mkdir -p /app/lib/rega /app/bin
      - cp -r app/build/linux/x64/release/bundle/. /app/lib/rega/
      - ln -s /app/lib/rega/rega /app/bin/rega
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.sergimn.rega
      - install -Dm644 app/build/linux/x64/release/licenses/rust-crates.txt app/build/linux/x64/release/licenses/rust-std.html
        -t /app/share/licenses/io.github.sergimn.rega
      # The AWS logo is AWS's trademark, not under ReGa's licence.
      - install -Dm644 app/assets/platforms/aws/README.md /app/share/licenses/io.github.sergimn.rega/aws-logo.md
      - install -Dm644 app/flatpak/io.github.sergimn.rega.desktop -t /app/share/applications
      - install -Dm644 app/flatpak/io.github.sergimn.rega.metainfo.xml -t /app/share/metainfo
      - install -Dm644 app/assets/icon/rega.svg /app/share/icons/hicolor/scalable/apps/io.github.sergimn.rega.svg
      - for s in 64 128 256 512; do install -Dm644 app/assets/icon/rega-$s.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.sergimn.rega.png;
        done
    sources:
      # The app, and the Terraform module and Ansible playbook it compiles in.
      # What local builds and runs leave in them stays out: build output,
      # Terraform's state and providers, and a real inventory, which holds a
      # password.
      - type: dir
        path: ..
        dest: app
        skip:
          - .dart_tool
          - .flatpak-builder
          - .flutter-plugins-dependencies
          - build
          - coverage
          - linux/flutter/ephemeral
          - rust_builder/.dart_tool
          - target
      - type: dir
        path: ../../infra/terraform/aws
        dest: infra/terraform/aws
        skip:
          - .terraform
          - terraform.tfstate
          - terraform.tfstate.backup
          - examples
          - tests
      - type: dir
        path: ../../infra/ansible
        dest: infra/ansible
        skip:
          - inventory.yml
          - tests
      - type: file
        path: ../../LICENSE
      # cargokit's build tool gets its Dart packages offline.
      - type: patch
        path: patches/cargokit-offline.patch
        dest: app/rust_builder/cargokit
      - generated/pub-sources.json
      - generated/cargo-sources.json
