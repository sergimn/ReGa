[package]
name = "rega_core"
version = "0.0.1"
edition = "2021"
description = "Provider-agnostic core of the ReGa desktop app"
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.0"
aws-lc-rs = "1.18.1"
aws-sdk-cloudwatch = "1.134.0"
aws-sdk-ec2 = "1.267.0"
aws-sdk-pricing = "1.118.0"
aws-sdk-s3 = "1.152.0"
aws-sdk-servicequotas = "1.116.0"
aws-sdk-sts = "1.119.0"
base64 = "0.22"
# The WireGuard protocol for the tunnel; no device or socket code.
boringtun = { version = "0.7.1", default-features = false }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# The same rustls reqwest uses, to pin Sunshine's certificate.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A TCP stack for connections through the tunnel.
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# A throwaway certificate and an HTTPS server for a fake Sunshine.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
