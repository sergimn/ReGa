[package]
name = "rega_core"
version = "0.1.0"
edition = "2021"
description = "Provider-agnostic core of the ReGa desktop app"
publish = false

[dependencies]
async-trait = "0.1"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.0"
aws-lc-rs = "1.18.1"
aws-sdk-cloudwatch = "1.134.0"
aws-sdk-ec2 = "1.267.0"
aws-sdk-pricing = "1.118.0"
aws-sdk-s3 = "1.152.0"
aws-sdk-servicequotas = "1.116.0"
aws-sdk-sts = "1.119.0"
base64 = "0.22"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "process", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
