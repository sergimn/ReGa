[package]
name = "rega_bridge"
version = "0.1.0"
edition = "2021"
description = "flutter_rust_bridge layer between the Flutter UI and rega_core"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.13.0"
rega_core = { path = "../core" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
