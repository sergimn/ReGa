[package]
name = "rega_bridge"
version = "0.0.2"
edition = "2021"
description = "flutter_rust_bridge layer between the Flutter UI and rega_core"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
futures = "0.3"
rega_core = { path = "../core" }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
