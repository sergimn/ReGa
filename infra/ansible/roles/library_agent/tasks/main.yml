---
- name: Copy the agent
  ansible.windows.win_copy:
    src: "{{ item }}"
    dest: "{{ rega_agent_dir }}\\{{ item }}"
  loop:
    - ReGa.Agent.psm1
    - rega-agent.ps1

- name: Write the agent config
  ansible.windows.win_copy:
    content: "{{ rega_agent_config | to_nice_json }}"
    dest: "{{ rega_agent_dir }}\\config.json"

- name: Restore the game library from S3 at boot
  community.windows.win_scheduled_task:
    name: ReGa-LibraryRestore
    description: Copies the Steam library from S3 to the library disk.
    actions:
      - path: powershell.exe
        arguments: "{{ rega_agent_command }} -Action Restore"
    triggers:
      - type: boot
    username: SYSTEM
    logon_type: service_account
    run_level: highest
    execution_time_limit: PT12H
    multiple_instances: 2
    state: present
    enabled: true

# A machine's first boot comes before the task exists, so start the restore
# now when no restore ran on this boot; later boots run it from the trigger.
- name: Restore the game library now if this boot hasn't
  ansible.windows.win_command:
    argv:
      - powershell.exe
      - -NoProfile
      - -ExecutionPolicy
      - Bypass
      - -File
      - "{{ rega_agent_dir }}\\rega-agent.ps1"
      - -Action
      - StartRestore
  register: rega_restore_start
  changed_when: (rega_restore_start.stdout_lines | last | from_json).started

# A registration trigger as well as the boot one, so the agent keeps running
# after Ansible updates the task without a reboot.
- name: Run the agent every minute
  community.windows.win_scheduled_task:
    name: ReGa-Agent
    description: Uploads finished downloads and stops the machine when idle.
    actions:
      - path: powershell.exe
        arguments: "{{ rega_agent_command }} -Action Tick"
    triggers:
      - type: boot
        repetition:
          interval: PT1M
      - type: registration
        repetition:
          interval: PT1M
    username: SYSTEM
    logon_type: service_account
    run_level: highest
    execution_time_limit: PT12H
    multiple_instances: 2
    state: present
    enabled: true

# Windows stores the logon trigger's user as COMPUTER\user; passing it in
# that form keeps the task from changing on every run.
- name: Read the computer name
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $env:COMPUTERNAME
  register: rega_computer_name

- name: Start Steam at logon once the library is restored
  community.windows.win_scheduled_task:
    name: ReGa-SteamLaunch
    description: Waits for the library restore, registers it with Steam and starts Steam.
    actions:
      - path: powershell.exe
        arguments: "-WindowStyle Hidden {{ rega_agent_command }} -Action LaunchSteam"
    triggers:
      - type: logon
        user_id: "{{ rega_computer_name.output[0] }}\\{{ rega_desktop_user }}"
    username: "{{ rega_desktop_user }}"
    logon_type: interactive_token
    run_level: limited
    execution_time_limit: PT4H
    multiple_instances: 2
    state: present
    enabled: true
