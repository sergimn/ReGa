---
# Sets up a ReGa machine (Windows Server 2022 on EC2) for game streaming.
# Run it after Terraform creates the machine, during the cheap CPU phase:
#   ansible-playbook -i inventory.yml site.yml
# Run it again after the first switch to the GPU type to install the NVIDIA
# driver right away; otherwise a boot task installs it on the first GPU boot.
- name: Set up a ReGa machine
  hosts: rega
  gather_facts: false
  pre_tasks:
    # The app runs this as soon as EC2 has the Windows password, which can be
    # before the boot script has WinRM listening.
    - name: Wait for WinRM
      ansible.builtin.wait_for_connection:
        timeout: 900

    # The roles reboot the machine as needed. Each reboot starts the library
    # restore's boot task, and the next one would cut that restore short.
    # While this note is there, a restore on a later boot waits for the
    # setup to end; the note goes once the roles are done. It's bookkeeping,
    # so it never counts as a change.
    - name: Note on the machine that a setup has started
      ansible.windows.win_powershell:
        parameters:
          Path: "{{ rega_state_dir }}\\setup.json"
        script: |
          param([string]$Path)
          $Ansible.Changed = $false
          New-Item -ItemType Directory -Path (Split-Path -Parent $Path) -Force | Out-Null
          $started = [datetime]::UtcNow.ToString('o', [Globalization.CultureInfo]::InvariantCulture)
          $json = [pscustomobject]@{ started_utc = $started } | ConvertTo-Json
          [IO.File]::WriteAllText($Path, $json, (New-Object Text.UTF8Encoding($false)))
  roles:
    - role: base
    - role: steam
    - role: sunshine
    - role: wireguard
    - role: library_agent
    - role: gpu
  post_tasks:
    # The roles won't reboot the machine again, so a restore that started on
    # one of their reboots can go ahead.
    - name: Let the library restore go ahead
      ansible.windows.win_file:
        path: "{{ rega_state_dir }}\\setup.json"
        state: absent
      changed_when: false

    - name: Write the connection details for the app
      ansible.builtin.copy:
        dest: "{{ rega_secrets_dir }}/connection.json"
        mode: "0600"
        content: "{{ rega_connection | to_nice_json }}\n"
      delegate_to: localhost
      vars:
        rega_connection:
          machine_id: "{{ rega_machine_id }}"
          desktop_user: "{{ rega_desktop_user }}"
          sunshine:
            username: "{{ rega_sunshine_username }}"
            web_ui_port: 47990
            cert_sha256: "{{ rega_sunshine_cert_sha256 }}"
          wireguard:
            port: "{{ rega_wireguard_port }}"
            server_public_key: "{{ rega_wireguard_server_public_key }}"
            server_address: "{{ rega_wireguard_server_address }}"
            client_address: "{{ rega_wireguard_client_address }}"
            mtu: "{{ rega_wireguard_mtu }}"
          secrets_dir: "{{ rega_secrets_dir }}"

    # A machine's first boot comes before the restore's boot task exists.
    # When the setup didn't reboot it since, start the restore now; it comes
    # after the roles' reboots, which would cut it short.
    - name: Restore the game library now if this boot hasn't
      ansible.windows.win_command:
        argv:
          - powershell.exe
          - -NoProfile
          - -ExecutionPolicy
          - Bypass
          - -File
          - "{{ rega_agent_dir }}\\rega-agent.ps1"
          - -Action
          - StartRestore
      register: rega_restore_start
      changed_when: (rega_restore_start.stdout_lines | last | from_json).started

    - name: Restart the idle clock so the user gets the full idle time to connect
      ansible.windows.win_command:
        argv:
          - powershell.exe
          - -NoProfile
          - -ExecutionPolicy
          - Bypass
          - -File
          - "{{ rega_agent_dir }}\\rega-agent.ps1"
          - -Action
          - ResetIdle
      changed_when: false
